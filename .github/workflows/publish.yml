name: publish
on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

  # Called by release-please: tags/releases made with GITHUB_TOKEN
  # do not trigger push/release events (recursive trigger guard),
  # so the tag name must be passed in as an input.
  workflow_call:
    inputs:
      tag:
        description: Tag created by release-please
        type: string
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended librsvg2-bin
      - name: Make docs
        run: make pdf markdown
      - name: Release MD and PDF
        uses: softprops/action-gh-release@v3
        with:
          working_directory: dist
          body_path: CHANGELOG.md
          # workflow_call has no tag ref (runs on main), so use the
          # release-please input; direct tag pushes use github.ref_name.
          tag_name: ${{ inputs.tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
