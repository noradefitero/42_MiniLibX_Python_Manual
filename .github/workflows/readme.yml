name: readme
on:
  release:
    types: [published]

  # Called by release-please: tags/releases made with GITHUB_TOKEN
  # do not trigger push/release events (recursive trigger guard)
  workflow_call:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release events check out a tag in detached HEAD, where
          # add-and-commit cannot push; check out the default branch instead
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install pandoc
        env:
          # Pinned: Ubuntu's apt pandoc predates the gfm `alerts` extension,
          # so > [!NOTE] callouts would ship as literal text.
          PANDOC_VERSION: "3.12.1"
        run: |
          curl -fsSL -o /tmp/pandoc.tar.gz \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          sudo tar -xzf /tmp/pandoc.tar.gz -C /usr/local --strip-components=1
          pandoc --version
      - name: Generate README.md
        run: make readme
      - name: Configure push credentials
        # add-and-commit pushes with plain git, and its github_token input is
        # API-only, so restore the auth header that checkout omits when
        # persist-credentials is false.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
      - name: Commit README.md
        uses: EndBug/add-and-commit@v11
        with:
          add: README.md
          message: "docs(README): update generated documentation"
