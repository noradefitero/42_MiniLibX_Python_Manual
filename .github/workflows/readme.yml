name: readme
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release events check out a tag in detached HEAD, where
          # add-and-commit cannot push; check out the default branch instead
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Generate README.md
        run: make readme
      - name: Commit README.md
        uses: EndBug/add-and-commit@v11
        with:
          add: README.md
          message: "docs(README): update generated documentation"
