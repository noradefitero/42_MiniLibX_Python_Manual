name: Deploy static content to Pages

on:
  push:
    tags:
      - "v*.*.*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Called by release-please: tags/releases made with GITHUB_TOKEN
  # do not trigger push/release events (recursive trigger guard)
  workflow_call:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - uses: actions/setup-python@v5
      - name: Install uv
        # Pinned to hash (blanket policy); bump comment when updating
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Publish workflow: never read from the Actions cache
          enable-cache: false
      - name: Make docs
        run: make web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist/web"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
